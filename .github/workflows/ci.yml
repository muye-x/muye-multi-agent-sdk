name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit cyclonedx-bom
      - run: python -m pip install -e '.[all,dev]'
      - run: pip-audit
      - run: cyclonedx-py environment --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[all,dev]'
      - run: python -m pytest -q tests
      - run: python -m compileall -q src examples
      - run: python -m build --wheel .

  workspace-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "$(find . -type d -name .git | wc -l)" -eq 1
      - run: test -z "$(find . -type f -name '*:Zone.Identifier' -print -quit)"
      - run: test -z "$(find . -type d \( -name .codex -o -name .agents -o -name .claude -o -name .cursor -o -name .continue -o -name .pytest_cache -o -name __pycache__ \) -print -quit)"
      - run: test -z "$(find . -type f \( -name '.env*' -o -name 'env.example' -o -name '*.db*' -o -name '*.sqlite*' -o -name '*.log*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.crt' \) -print -quit)"
      - run: test -z "$(find . -type f \( -name 'test_fix.py' -o -name 'test_fix_*.py' -o -name 'test_debug.py' -o -name 'test_debug_*.py' -o -name 'test_temp.py' -o -name 'test_temp_*.py' -o -name 'test_tmp.py' -o -name 'test_tmp_*.py' \) -print -quit)"
